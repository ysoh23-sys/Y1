<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오연석 | 모바일 명함</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #eaf2fb;
    color: #12233d;
    font-size: 20px;
    line-height: 1.6;
    word-break: keep-all;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(160deg, #0b3d91, #1565c0 60%, #1e88e5);
    color: #fff;
    text-align: center;
    padding: 56px 24px 44px;
    border-radius: 0 0 32px 32px;
  }
  .avatar {
    width: 96px; height: 96px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    border: 3px solid rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 800;
  }
  h1 { font-size: 44px; font-weight: 800; letter-spacing: 6px; }
  .intro { margin-top: 14px; font-size: 20px; opacity: .95; }
  .intro b { display: block; font-size: 22px; margin-bottom: 4px; }
  main { flex: 1; padding: 32px 20px 16px; }
  h2 { font-size: 24px; color: #0b3d91; margin: 0 4px 18px; }
  .item {
    display: flex; gap: 16px; align-items: flex-start;
    background: #f3f8fe;
    border-left: 6px solid #1565c0;
    border-radius: 16px;
    padding: 20px 18px;
    margin-bottom: 16px;
    opacity: 0; transform: translateY(16px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .item.show { opacity: 1; transform: none; }
  .num {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #1565c0; color: #fff;
    font-size: 22px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .item h3 { font-size: 23px; color: #0b3d91; line-height: 1.35; }
  .item p { font-size: 19px; color: #3b4d66; margin-top: 6px; }
  footer { padding: 12px 20px 36px; text-align: center; }
  .btn {
    display: block; width: 100%;
    padding: 20px;
    border: 0; border-radius: 18px;
    font-size: 26px; font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }
  .call {
    background: #0b3d91; color: #fff;
    box-shadow: 0 8px 20px rgba(11,61,145,.3);
  }
  .call:active { background: #082c69; }
  .copy {
    margin-top: 14px;
    background: #fff; color: #0b3d91;
    border: 2px solid #1565c0;
    font-size: 21px; padding: 15px;
  }
  .phone { margin-top: 18px; font-size: 24px; font-weight: 700; color: #0b3d91; }
  @media (prefers-reduced-motion: reduce) {
    .item { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <div class="avatar">오</div>
      <h1>오연석</h1>
      <p class="intro">
        <b>전국대학생가치투자대회 준비위원장</b>
        《행복부자학》 저자 · 前 경기대학교 교수
      </p>
    </header>

    <main>
      <h2>제가 하는 일</h2>

      <div class="item">
        <div class="num">1</div>
        <div>
          <h3>전국대학생가치투자대회</h3>
          <p>준비위원장으로 대학생들의 가치투자를 돕습니다.</p>
        </div>
      </div>

      <div class="item">
        <div class="num">2</div>
        <div>
          <h3>행복부자 카페지기</h3>
          <p>행복부자연구소 카페를 운영합니다.</p>
        </div>
      </div>

      <div class="item">
        <div class="num">3</div>
        <div>
          <h3>블로그 글쓰기 · 펀드매니저</h3>
          <p>투자하고, 그 생각을 글로 써서 나눕니다.</p>
        </div>
      </div>
    </main>

    <footer>
      <a class="btn call" href="tel:01054249009">📞 문의하기</a>
      <button class="btn copy" id="copyBtn" type="button">전화번호 복사</button>
      <p class="phone">010-5424-9009</p>
    </footer>
  </div>

<script>
  // 카드가 차례로 나타나는 효과
  document.querySelectorAll('.item').forEach(function (el, i) {
    setTimeout(function () { el.classList.add('show'); }, 150 * (i + 1));
  });

  // 전화번호 복사
  var btn = document.getElementById('copyBtn');
  var number = '010-5424-9009';
  btn.addEventListener('click', function () {
    function done() {
      btn.textContent = '복사되었습니다 ✓';
      setTimeout(function () { btn.textContent = '전화번호 복사'; }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(number).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = number;
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(t);
    }
  });
</script>
</body>
</html>
